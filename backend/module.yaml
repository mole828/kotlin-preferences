product:
  type: kmp/lib
  platforms: [jvm, linuxX64, linuxArm64, macosArm64]

settings:
  kotlin:
    serialization: enabled
  ktor:
    enabled: true
    version: 3.6.0

dependencies:
  - ../modeling
  - $ktor.server.core
  - $ktor.server.cio
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.server.statusPages
  - $ktor.server.sse
  - io.github.smyrgeorge:sqlx4k-postgres:1.12.0
  - org.kotlincrypto.macs:hmac-sha2:0.8.0
  - org.kotlincrypto.random:crypto-rand:0.6.0

test-dependencies@jvm:
  - ../client
  - $ktor.client.cio
  - bom: io.zonky.test.postgres:embedded-postgres-binaries-bom:18.3.0
  - io.zonky.test:embedded-postgres:2.2.2
